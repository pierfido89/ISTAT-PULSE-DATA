name: Refresh Unioncamere Excelsior feed
on:
  workflow_dispatch:
  schedule:
    - cron: '55 7 * * *'
  push:
    branches: [ main, feat/unioncamere-excelsior-feed ]
    paths:
      - 'scripts/update_unioncamere_excelsior.py'
      - '.github/workflows/refresh-unioncamere-excelsior.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_unioncamere_excelsior.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/unioncamere_excelsior_latest.json").read_text())
          assert d["source"]=="Unioncamere - Excelsior"
          assert d["period"]
          assert d["validated_attachment_count"]>=1
          print("EXCELSIOR OK",d["period"],d["validated_attachment_count"],d.get("entrate_programmate"))
          PY
      - run: |
          if git diff --quiet -- data/unioncamere_excelsior_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/unioncamere_excelsior_latest.json data/sources_catalog.json
          git commit -m "data: refresh Unioncamere Excelsior feed"
          git push
