name: Probe ISTAT A Misura Comune

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-istat-misura-comune.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check requests pandas openpyxl
      - name: Inspect official workbooks
        run: |
          python - <<'PY'
          import requests,io,pandas as pd
          H={'User-Agent':'Mozilla/5.0 ISTAT-PULSE-DATA'}
          files={
            'ambiente':'https://www.istat.it/storage/misura-comune/11-Territorio-e-ambiente.xlsx',
            'lavoro':'https://www.istat.it/storage/misura-comune/5-Lavoro.xlsx',
            'benessere':'https://www.istat.it/storage/misura-comune/6-Benessere-economico.xlsx'
          }
          for name,u in files.items():
              r=requests.get(u,timeout=120,headers=H)
              print('\nFILE',name,r.status_code,len(r.content),r.headers.get('content-type'))
              r.raise_for_status()
              xl=pd.ExcelFile(io.BytesIO(r.content))
              print('SHEETS',xl.sheet_names)
              for sh in xl.sheet_names[:3]:
                  df=pd.read_excel(io.BytesIO(r.content),sheet_name=sh,header=None,nrows=18)
                  print('SHEET',sh,'SHAPE',df.shape)
                  print(df.to_string(max_cols=40))
          PY
