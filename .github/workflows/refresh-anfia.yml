name: Refresh ANFIA feed

on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * *'
  push:
    branches:
      - main
      - feat/anfia-feed
    paths:
      - 'scripts/update_anfia.py'
      - '.github/workflows/refresh-anfia.yml'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Refresh ANFIA
        run: python scripts/update_anfia.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/anfia_latest.json")
          assert p.exists()
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["source"]=="ANFIA"
          assert d["period"]
          assert d["publication_date"]
          assert d["download_bytes"]>1000
          print("ANFIA", d["period"], d.get("passenger_cars_registered"), d.get("yoy_percent"))
          PY
      - name: Commit refreshed ANFIA data
        run: |
          if git diff --quiet -- data/anfia_latest.json data/sources_catalog.json; then
            echo "No ANFIA changes"
            exit 0
          fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/anfia_latest.json data/sources_catalog.json
          git commit -m "data: refresh ANFIA market feed"
          git push
