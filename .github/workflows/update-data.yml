name: Update PULSE Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1,4'
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: pulse-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate official territory registry
        run: python scripts/generate_territories.py

      - name: Generate DEMO demographic PULSE package
        run: |
          python scripts/generate_pulse_events.py
          cp app/src/main/assets/pulse_events.tsv app/src/main/assets/pulse_events_demo.tsv

      - name: Generate IstatData SDMX PULSE package
        run: python scripts/generate_sdmx_events.py

      - name: Acquire Noi Italia official annual series and pattern archive
        run: python scripts/generate_noi_italia.py

      - name: Extract latest observed regional BES measurements
        run: python scripts/generate_bes_observations.py

      - name: Download and validate A misura di Comune regional observations
        run: python scripts/generate_amc_observations.py

      - name: Publish observed measurements independently from current-year news
        run: python scripts/merge_pulse_observations.py

      - name: Merge multi-source PULSE feed
        run: python scripts/merge_pulse_feeds.py

      - name: Publish current data files
        run: |
          mkdir -p data
          cp app/src/main/assets/pulse_events.tsv data/pulse_events.tsv
          cp app/src/main/assets/pulse_manifest.json data/pulse_manifest.json
          cp app/src/main/assets/sources_catalog.json data/sources_catalog.json
          cp app/src/main/assets/pulse_events_noi.tsv data/pulse_events_noi.tsv

      - name: Commit updated data if changed
        run: |
          git config user.name "ISTAT PULSE Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pulse_events.tsv data/pulse_manifest.json data/sources_catalog.json data/pulse_events_noi.tsv
          if git diff --cached --quiet; then
            echo "No new ISTAT data to publish."
          else
            git commit -m "data: refresh PULSE package"
            git pull --rebase origin main
            git push
          fi
