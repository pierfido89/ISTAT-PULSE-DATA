name: Refresh AGCOM feed
on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * *'
  push:
    branches: [ main, feat/agcom-feed ]
    paths:
      - 'scripts/update_agcom.py'
      - '.github/workflows/refresh-agcom.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_agcom.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/agcom_latest.json").read_text())
          assert d["source"]=="AGCOM"
          assert len(d["open_data"])>=1
          print("AGCOM OK",d["year"],d["issue"],d["publication_date"])
          PY
      - run: |
          if git diff --quiet -- data/agcom_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/agcom_latest.json data/sources_catalog.json
          git commit -m "data: refresh AGCOM feed"
          git push
