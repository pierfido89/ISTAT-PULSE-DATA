name: Refresh GME feed
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
  push:
    branches: [ main, feat/gme-feed ]
    paths:
      - 'scripts/update_gme.py'
      - '.github/workflows/refresh-gme.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_gme.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/gme_latest.json").read_text())
          assert d["source"]=="GME"
          assert d["pun_row_count"]>0 or d["daily_reports"] or d["historical_archives"]
          print("GME OK",d["pun_latest_date"],d["pun_row_count"],len(d["daily_reports"]),len(d["historical_archives"]))
          PY
      - run: |
          if git diff --quiet -- data/gme_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gme_latest.json data/sources_catalog.json
          git commit -m "data: refresh GME market feed"
          git push
