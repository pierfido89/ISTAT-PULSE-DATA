name: Validate Copernicus EOBS Latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validate-copernicus-eobs.yml'

permissions:
  contents: read

jobs:
  eobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests netCDF4 numpy
      - name: Download latest public E-OBS monthly files
        run: |
          python - <<'PY'
          import requests, os, json
          from netCDF4 import Dataset, num2date
          import numpy as np
          base='https://knmi-ecad-assets-prd.s3.amazonaws.com/ensembles/data/months/ens'
          for code in ('tg','rr'):
              url=f'{base}/{code}_0.25deg_day_2026_08_grid_ensmean.nc'
              target=f'/tmp/{code}.nc'
              r=requests.get(url,timeout=120,headers={'User-Agent':'ISTAT-PULSE-DATA/Copernicus-EOBS'})
              r.raise_for_status()
              open(target,'wb').write(r.content)
              print('FILE',code,'bytes',len(r.content))
              ds=Dataset(target)
              print('VARS',code,list(ds.variables.keys()))
              for name,v in ds.variables.items():
                  print('VAR',name,v.dimensions,v.shape,getattr(v,'units',''))
              t=ds.variables['time']
              dates=num2date(t[:],t.units,only_use_cftime_datetimes=False)
              print('DATES',code,str(dates[0]),str(dates[-1]),'n',len(dates))
              ds.close()
          PY
