# feed-retrigger
name: Refresh RGS feed
on:
  workflow_dispatch:
  schedule:
    - cron: '50 9 * * *'
  push:
    branches: [ main, feat/rgs-feed ]
    paths:
      - 'scripts/update_rgs.py'
      - '.github/workflows/refresh-rgs.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_rgs.py
      - run: |
          test -s data/rgs_latest.json
      - run: |
          if git diff --quiet -- data/rgs_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rgs_latest.json data/sources_catalog.json
          git commit -m "data: refresh RGS feed"
          git push
