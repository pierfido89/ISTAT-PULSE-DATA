name: Probe EEA GHG Latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-eea-ghg.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas
      - name: Probe latest EEA GHG WebDAV package
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          base='https://sdi.eea.europa.eu/webdav/datastore/public/eea_t_national-emissions-reported_p_2026_v02_r00'
          r=requests.get(base,timeout=90,headers={'User-Agent':'ISTAT-PULSE-DATA/EEA'})
          print('STATUS',r.status_code,'URL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
          print(r.text[:12000])
          PY
