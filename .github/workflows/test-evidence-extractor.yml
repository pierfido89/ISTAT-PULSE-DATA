name: Test PULSE universal evidence extractor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/pulse_evidence.py'
      - 'scripts/pulse_evidence_adapters.py'
      - 'scripts/update_news_radar.py'
      - 'tests/test_pulse_evidence*.py'
      - 'tests/test_pulse_evidence_phase2.py'
      - '.github/workflows/test-evidence-extractor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pulse_evidence.py'
      - 'scripts/update_news_radar.py'
      - 'tests/test_pulse_evidence*.py'
      - '.github/workflows/test-evidence-extractor.yml'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 openpyxl xlrd pdfplumber reportlab
      - run: python -m unittest discover -s tests -p test_pulse_evidence.py -v
      - run: python -m unittest discover -s tests -p test_pulse_evidence_phase2.py -v
      - run: python -m py_compile scripts/pulse_evidence.py scripts/pulse_evidence_adapters.py scripts/update_news_radar.py

  five-real-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true # Public websites may reject automated traffic; never misreport a pass.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 openpyxl xlrd pdfplumber
      - run: python -m unittest discover -s tests -p test_pulse_evidence_live.py -v
