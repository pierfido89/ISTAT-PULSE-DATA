name: ISMEA Observer Test

on:
  workflow_dispatch:
  push:
    branches: [ feat/news-engine ]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/ismea-observer-test.yml'

jobs:
  test-ismea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe ISMEA endpoints
        shell: bash
        run: |
          set +e
          for u in \
            "https://www.ismea.it/Press-Area/Comunicati-Stampa/L/IT/YY/2026/MM/4" \
            "https://www.ismea.it/Press-Area/Comunicati-Stampa?MM=4&YY=2026" \
            "https://www.ismea.it/robots.txt" \
            "https://www.ismea.it/sitemap.xml"
          do
            echo "=== $u"
            curl -k -L -A "Mozilla/5.0" -sS -D /tmp/h -o /tmp/b "$u"
            head -n 20 /tmp/h
            echo "BYTES=$(wc -c </tmp/b)"
            head -c 500 /tmp/b | tr '\n' ' ' ; echo
          done
      - name: Inspect ISMEA April HTML
        shell: bash
        run: |
          curl -k -L -A "Mozilla/5.0" -sS "https://www.ismea.it/Press-Area/Comunicati-Stampa/L/IT/YY/2026/MM/4" -o /tmp/ismea-aprile.html
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/ismea-aprile.html").read_text(encoding="latin-1",errors="ignore")
          for needle in ["22/04/2026","120 milioni","21/04/2026","Macfrut 2026"]:
              i=s.find(needle)
              print("\nNEEDLE",needle,"AT",i)
              print(s[max(0,i-1200):i+2200] if i>=0 else "NOT FOUND")
          PY
      - name: Test ISMEA only
        run: python scripts/update_observer_archive.py --only ISMEA
