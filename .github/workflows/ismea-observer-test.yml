name: ISMEA Observer Test

on:
  workflow_dispatch:
  push:
    branches: [ feat/news-engine ]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/ismea-observer-test.yml'

jobs:
  test-ismea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe ISMEA endpoints
        shell: bash
        run: |
          set +e
          for u in \
            "https://www.ismea.it/Press-Area/Comunicati-Stampa/L/IT/YY/2026/MM/4" \
            "https://www.ismea.it/Press-Area/Comunicati-Stampa?MM=4&YY=2026" \
            "https://www.ismea.it/robots.txt" \
            "https://www.ismea.it/sitemap.xml"
          do
            echo "=== $u"
            curl -L -A "Mozilla/5.0" -sS -D /tmp/h -o /tmp/b "$u"
            head -n 20 /tmp/h
            echo "BYTES=$(wc -c </tmp/b)"
            head -c 500 /tmp/b | tr '\n' ' ' ; echo
          done
      - name: Test ISMEA only
        run: python scripts/update_observer_archive.py --only ISMEA
