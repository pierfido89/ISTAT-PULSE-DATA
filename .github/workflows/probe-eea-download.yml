name: Probe EEA Direct Download

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-eea-download.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe public EEA download
        run: |
          python - <<'PY'
          import requests, zipfile, io
          urls=[
            'https://sdi.eea.europa.eu/datashare/s/sptXqwkQr5g7Bp5/download',
            'https://sdi.eea.europa.eu/datashare/index.php/s/sptXqwkQr5g7Bp5/download',
          ]
          for u in urls:
              try:
                  r=requests.get(u,timeout=120,headers={'User-Agent':'ISTAT-PULSE-DATA/EEA'},allow_redirects=True)
                  print('URL',u,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
                  print('ZIP',zipfile.is_zipfile(io.BytesIO(r.content)))
                  if zipfile.is_zipfile(io.BytesIO(r.content)):
                      with zipfile.ZipFile(io.BytesIO(r.content)) as z:
                          print('FILES',z.namelist()[:100])
                  else:
                      print('HEAD',r.content[:300])
              except Exception as e:
                  print('ERR',u,repr(e))
          PY
