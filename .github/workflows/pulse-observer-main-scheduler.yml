name: PULSE - update Observer archive on main (official publications)

on:
  schedule:
    # Cron is UTC: evaluate local Rome slots for CET and CEST. GitHub
    # scheduled workflows run ONLY from the repository default branch.
    - cron: '0 4,5,9,10,14,15,20,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-observer-main-scheduler
  cancel-in-progress: false

jobs:
  official-observer-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Check Italian local publishing slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          h="$(TZ=Europe/Rome date +%H)"
          case "$h" in
            06|11|16|22) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Checkout stable DATA main
        if: steps.slot.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: data-main
      - name: Checkout established Observer collection engine
        if: steps.slot.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: feat/news-engine
          path: observer-engine
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install current Observer connectors (free official sources)
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 pypdf \
            'googlenewsdecoder @ git+https://github.com/SSujitX/google-news-url-decoder.git@d38ddbdd510561859da0dae0c1176e3a2676c159' \
            'selectolax==0.4.12'
      - name: Refresh established official publication feeds
        if: steps.slot.outputs.run == 'true'
        working-directory: observer-engine
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/update_observer_archive.py
      - name: Gate incomplete and empty GREEN datasets
        if: steps.slot.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("observer-engine/data/news/observer_articles.json")
          obj = json.loads(src.read_text(encoding="utf-8"))
          articles = obj.get("articles")
          if not isinstance(articles, list) or len(articles) < 1000:
              raise SystemExit("Observer refresh rejected: truncated official archive")
          green = 0
          for row in articles:
              if not isinstance(row, dict): continue
              if not str(row.get("published_at","")).startswith("2026-"): continue
              if not str((row.get("public_source") or {}).get("url","")).startswith("https://"): continue
              t = " ".join(str(row.get(k,"")) for k in
                  ("topic","headline","summary","pulse_title","pulse_summary")).casefold()
              if any(x in t for x in (
                  "clima","emission","rinnovabil","energia","elettric","rifiut",
                  "ricicl","biodivers","suolo","idrico","acqua","mobilit","veicol")):
                  green += 1
          if green < 100:
              raise SystemExit("Observer refresh rejected: implausibly empty GREEN publications")
          print("Observer official articles:",len(articles),"GREEN candidates:",green)
          PY
      - name: Publish verified snapshot to default branch
        if: steps.slot.outputs.run == 'true'
        working-directory: data-main
        run: |
          set -euo pipefail
          mkdir -p data/news
          cp ../observer-engine/data/news/observer_articles.json data/news/observer_articles.json
          git add data/news/observer_articles.json
          if git diff --cached --quiet; then
            echo "No changes in verified official archive"
            exit 0
          fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh official Observers GREEN publications"
          git pull --rebase origin main
          git push origin HEAD:main
