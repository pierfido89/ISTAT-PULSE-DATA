name: MIM Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/mim-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf 'googlenewsdecoder @ git+https://github.com/SSujitX/google-news-url-decoder.git@d38ddbdd510561859da0dae0c1176e3a2676c159' 'selectolax==0.4.12'
      - name: Probe MIM endpoints
        run: |
          python - <<'PY'
          import urllib.request,re,json
          urls=[
            "https://www.mim.gov.it/web/guest/comunicati",
            "https://www.mim.gov.it/sitemap.xml",
            "https://www.mim.gov.it/robots.txt",
            "https://www.mim.gov.it/rss",
            "https://www.mim.gov.it/feed",
            "https://www.mim.gov.it/o/headless-delivery/v1.0/sites",
            "https://www.mim.gov.it/o/api",
            "https://www.mim.gov.it/o/headless-admin-user/v1.0/user-accounts"
          ]
          for u in urls:
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/html,application/xml;q=0.9,*/*;q=0.6"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(2500000); ct=r.headers.get("Content-Type",""); final=r.geturl()
                  txt=raw.decode("utf-8","ignore")
                  print("URL",u,"OK",r.status,ct,"BYTES",len(raw),"FINAL",final,flush=True)
                  print("COUNT2026",txt.count("2026"),"LIFERAY",txt.lower().count("liferay"),"HEADLESS",txt.lower().count("headless"),flush=True)
                  if "json" in ct.lower() or txt.lstrip().startswith(("{","[")):
                      try:
                          data=json.loads(txt)
                          print("JSONTYPE",type(data).__name__,flush=True)
                          if isinstance(data,dict): print("KEYS",list(data.keys())[:40],flush=True)
                      except Exception as e: print("JSONERR",e,flush=True)
              except Exception as e:
                  print("URL",u,"ERROR",type(e).__name__,e,flush=True)
          PY
      - name: Test MIM only
        run: python scripts/update_observer_archive.py --only "Ministero dell'Istruzione e del Merito"
