name: Refresh PULSE News Radar
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run both CET/CEST candidates and gate by Europe/Rome.
    - cron: '0 22,23,4,5,9,10,14,15,20,21 * * *'
  push:
    branches: [ main, feat/news-engine ]
    paths:
      - 'scripts/update_news_radar.py'
      - 'scripts/update_observer_archive.py'
      - 'data/news_radar_sources.json'
      - 'data/observer_sources.json'
      - '.github/workflows/refresh-news-radar.yml'
permissions:
  contents: write
concurrency:
  group: pulse-news-radar-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check Rome news slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Rome date +%H)"
          case "$hour" in
            00|06|11|16|22) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
      - if: steps.slot.outputs.run == 'true'
        run: python -m pip install beautifulsoup4 pypdf
      - if: steps.slot.outputs.run == 'true'
        run: python scripts/update_news_radar.py
      - if: steps.slot.outputs.run == 'true'
        run: python scripts/update_observer_archive.py
      - if: steps.slot.outputs.run == 'true'
        run: test -s data/news/index.json
      - if: steps.slot.outputs.run == 'true'
        run: test -s data/news/observer_articles.json
      - if: steps.slot.outputs.run == 'true'
        run: |
          git add data/news
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh PULSE news radar"
          git push
