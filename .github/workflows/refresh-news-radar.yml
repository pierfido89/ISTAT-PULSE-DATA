name: Refresh PULSE News Radar

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Candidate hours cover CET and CEST;
    # the Rome-time gate below keeps only 06:00, 11:00, 16:00, 22:00.
    - cron: '0 4,5,9,10,14,15,20,21 * * *'
  push:
    branches: [ main ]
    paths:
      - 'scripts/update_news_radar.py'
      - 'scripts/pulse_evidence.py'
      - 'data/news_radar_sources.json'
      - '.github/workflows/refresh-news-radar.yml'

permissions:
  contents: write

concurrency:
  group: pulse-news-radar-production-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check Rome news slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Rome date +%H)"
          case "$hour" in
            06|11|16|22) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'

      - if: steps.slot.outputs.run == 'true'
        run: python -m pip install beautifulsoup4 pypdf pdfplumber openpyxl xlrd

      - name: Validate source table comparison extraction
        if: steps.slot.outputs.run == 'true'
        run: |
          python - <<'PY'
          from scripts.update_news_radar import extract_verified_year_comparisons
          html = b'<table><caption>Quota %</caption><tr><th>Indicatore</th><th>2024</th><th>2025</th></tr><tr><th>Occupazione femminile</th><td>48,5</td><td>50,1</td></tr></table>'
          result = extract_verified_year_comparisons(html, 'text/html', 'https://istat.it/prova')
          assert len(result) == 1, result
          assert result[0]['observations'][0]['value'] == 48.5
          assert result[0]['observations'][1]['value'] == 50.1
          no_unit = html.replace(b'Quota %', b'Rapporto')
          assert extract_verified_year_comparisons(no_unit, 'text/html', 'https://istat.it/prova') == []
          assert extract_verified_year_comparisons(html, 'application/pdf', 'https://istat.it/prova.pdf') == []
          print('Verified statistical comparisons: 3 tests passed')
          PY

      - if: steps.slot.outputs.run == 'true'
        run: python scripts/update_news_radar.py

      - if: steps.slot.outputs.run == 'true'
        run: |
          test -s data/news/index.json
          test -s data/news/articles.json
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path("data/news/index.json").read_text())
          assert not (set(idx["oggi"]) & set(idx["ieri"]))
          assert not (set(idx["oggi"]) & set(idx["archivio"]))
          assert not (set(idx["ieri"]) & set(idx["archivio"]))
          print("News buckets disjoint:", idx["counts"])
          PY

      - name: Publish updated Radar news
        id: published_news
        if: steps.slot.outputs.run == 'true'
        run: |
          git add data/news
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh production PULSE news radar"

          # Other PULSE workflows may update main while the radar is running.
          # Rebase the generated news commit onto the latest main instead of
          # losing a valid radar refresh to a non-fast-forward rejection.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made using GITHUB_TOKEN does NOT trigger another Actions workflow.
      # Dispatch here after a successful feed update; no Android 2-hour polling.
      - name: Check consent-based FCM backend configuration
        id: push_config
        if: steps.published_news.outputs.pushed == 'true'
        env:
          PRIVATE_FIREBASE: ${{ secrets.PULSE_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PRIVATE_FIREBASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "FCM credentials missing: no real push is attempted."
          fi

      - name: Deliver real FCM push for the new publication
        if: steps.push_config.outputs.available == 'true'
        env:
          PRIVATE_FIREBASE: ${{ secrets.PULSE_FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/pulse-fcm-service-account.json' EXIT
          printf '%s' "$PRIVATE_FIREBASE" > /tmp/pulse-fcm-service-account.json
          chmod 600 /tmp/pulse-fcm-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/pulse-fcm-service-account.json
          python -m pip install --disable-pip-version-check firebase-admin==7.1.0
          python -m scripts.pulse_push_dispatch --feed data/news/articles.json --max-sends 500
