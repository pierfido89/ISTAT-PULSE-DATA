name: PULSE NEW timestamp provenance and expiry
on:
  push:
    branches: [feat/pulse-new-badge-180min-20261012]
    paths:
      - 'scripts/pulse_new_badge.py'
      - 'scripts/update_news_radar.py'
      - 'tests/test_pulse_new_badge.py'
      - '.github/workflows/pulse-new-badge-news-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test first-publication provenance and 180 minutes
        run: python -m unittest tests.test_pulse_new_badge -v
      - name: Parse edited radar generator
        run: python -m py_compile scripts/update_news_radar.py scripts/pulse_new_badge.py
      - name: Preview-only; no dataset or article writes
        run: echo "No feed regeneration, no publication, no paid API."
