name: Probe BES Territories

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-bes.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check pandas openpyxl
      - name: Inspect official BES Territories 2025 workbook
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile, pandas as pd
          url='https://www.istat.it/wp-content/uploads/2025/06/Bes_dei_territori_edizione_2025.zip'
          req=urllib.request.Request(url, headers={'User-Agent':'ISTAT-PULSE/0.6'})
          with urllib.request.urlopen(req, timeout=120) as r:
              raw=r.read()
              print('HTTP', r.status, 'bytes', len(raw), 'content-type', r.headers.get('content-type'))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              name='Indicatori_per_provincia_sesso_ed.2025.xlsx'
              book=z.read(name)
          xls=pd.ExcelFile(io.BytesIO(book))
          print('SHEETS', xls.sheet_names)
          for sheet in xls.sheet_names:
              print('\n### SHEET',sheet)
              df=pd.read_excel(io.BytesIO(book), sheet_name=sheet, header=None, nrows=12)
              print(df.to_string(index=False, header=False))
          PY
