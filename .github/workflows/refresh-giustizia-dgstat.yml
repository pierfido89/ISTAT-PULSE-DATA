name: Refresh Giustizia DGStat feed
on:
  workflow_dispatch:
  schedule:
    - cron: '50 9 * * *'
  push:
    branches: [ main, feat/giustizia-dgstat-feed ]
    paths:
      - 'scripts/update_giustizia_dgstat.py'
      - '.github/workflows/refresh-giustizia-dgstat.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_giustizia_dgstat.py
      - run: |
          test -s data/giustizia_dgstat_latest.json
      - run: |
          if git diff --quiet -- data/giustizia_dgstat_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/giustizia_dgstat_latest.json data/sources_catalog.json
          git commit -m "data: refresh Giustizia DGStat feed"
          git push
