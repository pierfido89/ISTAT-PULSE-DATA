name: Probe ISPRA Waste CSV

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-ispra-waste.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe ISPRA municipal waste downloads
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          u='https://www.catasto-rifiuti.isprambiente.it/index.php?advice=si&pg=downloadComune'
          r=requests.get(u,timeout=60,headers={'User-Agent':'Mozilla/5.0 ISTAT-PULSE-DATA'})
          print('STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
          soup=BeautifulSoup(r.text,'html.parser')
          for a in soup.find_all('a',href=True):
              txt=' '.join(a.stripped_strings)
              href=requests.compat.urljoin(u,a['href'])
              if '2024' in txt or 'csv' in href.lower() or 'download' in href.lower():
                  print('LINK',txt,'|',href)
          print('FORMS')
          for f in soup.find_all('form'):
              print('FORM',f.get('method'),f.get('action'))
              for inp in f.find_all(['input','button','select']):
                  print(' ',inp.name,inp.get('name'),inp.get('value'),inp.get('type'))
          PY
