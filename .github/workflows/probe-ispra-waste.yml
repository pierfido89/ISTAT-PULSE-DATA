name: Probe ISPRA Waste CSV

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-ispra-waste.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas
      - name: Inspect ISPRA 2024 municipal waste CSV
        run: |
          python - <<'PY'
          import requests,io,pandas as pd
          u='https://www.catasto-rifiuti.isprambiente.it/get/getDettaglioComunale.csv.php?&aa=2024'
          r=requests.get(u,timeout=120,headers={'User-Agent':'Mozilla/5.0 ISTAT-PULSE-DATA'})
          print('STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
          r.raise_for_status()
          print('HEAD_BYTES',r.content[:200])
          for enc in ['utf-8-sig','cp1252','latin1']:
              try:
                  txt=r.content.decode(enc)
                  print('ENCODING',enc,'HEAD',txt[:500].replace('\n',' | '))
                  break
              except Exception:
                  pass
          df=pd.read_csv(io.BytesIO(r.content),sep=None,engine='python',encoding=enc)
          print('SHAPE',df.shape)
          print('COLUMNS',list(df.columns))
          print(df.head(8).to_string())
          print('TAIL',df.tail(3).to_string())
          PY
