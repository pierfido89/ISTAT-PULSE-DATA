name: Probe ISPRA Waste CSV

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-ispra-waste.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas
      - name: Inspect ISPRA 2024 municipal waste CSV
        run: |
          python - <<'PY'
          import requests,io,pandas as pd
          u='https://www.catasto-rifiuti.isprambiente.it/get/getDettaglioComunale.csv.php?&aa=2024'
          r=requests.get(u,timeout=120,headers={'User-Agent':'Mozilla/5.0 ISTAT-PULSE-DATA'})
          r.raise_for_status()
          df=pd.read_csv(io.BytesIO(r.content),sep=';',skiprows=1,encoding='utf-8-sig',dtype=str)
          print('SHAPE',df.shape)
          print('COLUMNS',list(df.columns))
          print(df[['Regione','Provincia','Comune','Popolazione','Totale RD (t)','Totale RU (t)','Percentuale RD (%)']].head(12).to_string())
          print('REGIONS',df['Regione'].nunique(),sorted(df['Regione'].dropna().unique().tolist()))
          PY
