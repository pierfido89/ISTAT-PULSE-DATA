name: Validate ISTAT BES Territori 2025

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validate-istat-bes-2025.yml'
      - 'scripts/generate_bes_events.py'
      - 'scripts/generate_bes_observations.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate BES signals and observations
        run: |
          python scripts/generate_bes_events.py
          python scripts/generate_bes_observations.py
          python - <<'PY'
          import json,pandas as pd
          ev=pd.read_csv('app/src/main/assets/pulse_events_bes.tsv',sep='\t',dtype=str,keep_default_na=False)
          ob=pd.read_csv('app/src/main/assets/pulse_observations_bes.tsv',sep='\t',dtype=str,keep_default_na=False)
          meta=json.load(open('app/src/main/assets/pulse_bes_meta.json'))
          print('EVENTS',len(ev))
          print('EVENT_YEARS',ev['period'].str[:4].value_counts().sort_index().to_dict())
          print('EVENT_SCOPES',ev['scope'].value_counts().to_dict())
          print('OBS',len(ob))
          print('OBS_YEARS',ob['period'].value_counts().sort_index().to_dict())
          print('META',json.dumps(meta,ensure_ascii=False))
          print('TOP',ev[['municipality','indicator','patterns','score','period']].head(20).to_string(index=False))
          assert len(ev)>0
          assert len(ob)>300
          assert meta['latest_year']<=2025
          PY
