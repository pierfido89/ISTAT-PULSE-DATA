name: Probe ISPRA Water Air

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-ispra-water-air.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas openpyxl
      - name: Probe BIGBANG and air CSV
        run: |
          python - <<'PY'
          import requests,re,io,pandas as pd
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 ISTAT-PULSE-DATA'}
          s=requests.Session()

          u='https://www.isprambiente.gov.it/pre_meteo/idro/BIGBANG_ISPRA.html'
          r=s.get(u,timeout=90,headers=H); r.raise_for_status()
          print('BIGBANG_PAGE',r.status_code,len(r.content))
          soup=BeautifulSoup(r.text,'html.parser')
          for a in soup.find_all('a',href=True):
              href=requests.compat.urljoin(r.url,a['href'])
              txt=' '.join(a.stripped_strings)
              if re.search(r'(xlsx?|zip|csv)',href,re.I) or 'tabellare' in txt.lower():
                  print('BIGLINK',txt[:160],'|',href)

          air='https://www.isprambiente.gov.it/files2024/attivita/aria'
          rr=s.get(air,timeout=90,headers=H); rr.raise_for_status()
          bs=BeautifulSoup(rr.text,'html.parser')
          links=[]
          for a in bs.find_all('a',href=True):
              href=requests.compat.urljoin(rr.url,a['href'])
              txt=' '.join(a.stripped_strings)
              if href.lower().endswith('.csv') or '.csv?' in href.lower():
                  links.append((txt,href))
                  print('AIRLINK',txt[:160],'|',href)
          for txt,href in links[:8]:
              try:
                  x=s.get(href,timeout=120,headers=H); x.raise_for_status()
                  print('AIRCSV',href,'LEN',len(x.content),'TYPE',x.headers.get('content-type'))
                  df=pd.read_csv(io.BytesIO(x.content),sep=None,engine='python',encoding='utf-8-sig',nrows=5)
                  print('AIRCOLS',list(df.columns))
                  print(df.head().to_string(max_cols=40))
              except Exception as e:
                  print('AIRERR',href,repr(e))
          PY
