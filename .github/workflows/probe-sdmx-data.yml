name: Probe SDMX Data

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-sdmx-data.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one current ISTATData series
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          flow='151_874_DF_DCCV_TAXDISOCCUMENS1_1'
          url=f'https://esploradati.istat.it/SDMXWS/rest/v1/data/{flow}/all/IT1?startPeriod=2024&endPeriod=2026'
          req=urllib.request.Request(url, headers={
              'User-Agent':'ISTAT-PULSE/0.6',
              'Accept':'application/vnd.sdmx.genericdata+xml;version=2.1'
          })
          with urllib.request.urlopen(req, timeout=120) as r:
              raw=r.read()
              print('HTTP',r.status,'bytes',len(raw),'type',r.headers.get('content-type'))
          root=ET.fromstring(raw)
          n=0
          for series in root.iter():
              if series.tag.rsplit('}',1)[-1] != 'Series':
                  continue
              print('SERIES')
              for child in series:
                  tag=child.tag.rsplit('}',1)[-1]
                  if tag=='SeriesKey':
                      vals=[]
                      for v in child:
                          vals.append((v.attrib.get('id'),v.attrib.get('value')))
                      print('KEY',vals)
                  elif tag=='Obs':
                      time=None; value=None
                      for v in child:
                          t=v.tag.rsplit('}',1)[-1]
                          if t=='ObsDimension': time=v.attrib.get('value')
                          if t=='ObsValue': value=v.attrib.get('value')
                      print('OBS',time,value)
                      n += 1
                      if n >= 20:
                          raise SystemExit
          PY
