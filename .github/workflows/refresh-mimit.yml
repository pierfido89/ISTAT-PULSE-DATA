name: Refresh MIMIT feed
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
  push:
    branches: [ main, feat/mimit-feed ]
    paths:
      - 'scripts/update_mimit.py'
      - '.github/workflows/refresh-mimit.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_mimit.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/mimit_latest.json").read_text())
          assert d["source"]=="MIMIT"
          assert "prices" in d["datasets"]
          assert d["datasets"]["prices"]["bytes"]>100
          print("MIMIT OK",d["regional_average_date"],d["regional_average_count"])
          PY
      - run: |
          if git diff --quiet -- data/mimit_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mimit_latest.json data/sources_catalog.json
          git commit -m "data: refresh MIMIT fuel feed"
          git push
