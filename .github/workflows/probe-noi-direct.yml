name: Probe Noi Italia Direct
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/probe_noi_direct.py'
      - '.github/workflows/probe-noi-direct.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas openpyxl
      - run: python scripts/probe_noi_direct.py
