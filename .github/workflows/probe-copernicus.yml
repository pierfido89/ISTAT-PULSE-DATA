name: Probe Copernicus ERA5

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-copernicus.yml'
      - 'scripts/generate_green_events.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Copernicus connector
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import scripts.generate_green_events as g
          source=next(x for x in g.SOURCES if x["name"].startswith("Copernicus -"))
          st,events=g.run_copernicus(source)
          print(json.dumps(st,ensure_ascii=False,indent=2))
          print("EVENTS",len(events))
          assert st["status"] in {"connected","feed"}, st
          assert st.get("latest_period")=="2026-08", st
          assert any(x.get("name","").startswith("Temperatura media mensile ERA5") for x in st.get("series",[])), st
          assert any(x.get("name","").startswith("Precipitazione media giornaliera nel mese ERA5") for x in st.get("series",[])), st
          PY
