name: Probe EEA Datastore Listing

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-eea-datastore.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect redirected datastore page
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          u='https://sdi.eea.europa.eu/datastore/public/eea_t_national-emissions-reported_p_2026_v02_r00'
          r=requests.get(u,timeout=60,headers={'User-Agent':'ISTAT-PULSE-DATA/EEA'})
          print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
          soup=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
              href=requests.compat.urljoin(r.url,a['href'])
              txt=' '.join(a.stripped_strings)
              if re.search(r'csv|sqlite|mdb|accdb|download',href+' '+txt,re.I):
                  links.append((txt,href))
          print('LINKS',len(links))
          for x in links[:200]: print('LINK',x[0],'|',x[1])
          print(r.text[:12000])
          PY
