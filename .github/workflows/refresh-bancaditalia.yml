name: Refresh Banca d'Italia feed

on:
  workflow_dispatch:
  schedule:
    - cron: '55 6 * * *'
  push:
    branches: [ main, feat/bancaditalia-feed ]
    paths:
      - 'scripts/update_bancaditalia.py'
      - '.github/workflows/refresh-bancaditalia.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Refresh Banca d'Italia
        run: python scripts/update_bancaditalia.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/bancaditalia_latest.json").read_text(encoding="utf-8"))
          assert d["source"]=="Banca d'Italia"
          assert d["dataset_count"]>=3
          assert d["latest_period"]
          for k,v in d["datasets"].items():
              assert v["status"]=="ok"
              assert v["download_bytes"]>500
              assert v["file_count"]>=1
          print("BANCA ITALIA OK",d["dataset_count"],d["latest_period"],d["failures"])
          PY
      - name: Commit refreshed Banca d'Italia data
        run: |
          if git diff --quiet -- data/bancaditalia_latest.json data/sources_catalog.json; then
            echo "No Banca d'Italia changes"
            exit 0
          fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bancaditalia_latest.json data/sources_catalog.json
          git commit -m "data: refresh Banca d'Italia feed"
          git push
