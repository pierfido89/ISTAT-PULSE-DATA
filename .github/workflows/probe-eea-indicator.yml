name: Probe EEA Indicator Download

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-eea-indicator.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe EEA indicator package
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          u='https://sdi.eea.europa.eu/data/6dee7ee7-ae9c-4017-a3b1-bbef822c74f8'
          r=requests.get(u,timeout=60,headers={'User-Agent':'ISTAT-PULSE-DATA/EEA'})
          print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
          soup=BeautifulSoup(r.text,'html.parser')
          for a in soup.find_all('a',href=True):
              href=requests.compat.urljoin(r.url,a['href'])
              txt=' '.join(a.stripped_strings)
              if re.search(r'csv|xlsx|xls|download',href+' '+txt,re.I):
                  print('LINK',txt,'|',href)
          PY
