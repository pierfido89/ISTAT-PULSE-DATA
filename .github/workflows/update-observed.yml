name: Publish Verified Observed ISTAT Data

on:
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 2'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-observed.yml'
      - 'scripts/generate_bes_observations.py'
      - 'scripts/generate_amc_observations.py'
      - 'scripts/generate_noi_italia.py'
      - 'scripts/merge_pulse_observations.py'

permissions:
  contents: write

concurrency:
  group: pulse-observed-data
  cancel-in-progress: true

jobs:
  observed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dataset parsers
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Acquire IstatData official series and record every latest observation
        run: python scripts/generate_sdmx_events.py
      - name: Acquire Noi Italia official annual series
        run: python scripts/generate_noi_italia.py
      - name: Acquire and validate regional BesT observations
        run: python scripts/generate_bes_observations.py
      - name: Acquire and validate official municipal-system tables
        run: python scripts/generate_amc_observations.py
      - name: Merge observed data separately from the current-year news
        run: python scripts/merge_pulse_observations.py
      - name: Publish verified observation package
        run: |
          mkdir -p data
          cp app/src/main/assets/pulse_observations.tsv data/pulse_observations.tsv
          cp app/src/main/assets/pulse_observations_manifest.json data/pulse_observations_manifest.json
          cp app/src/main/assets/pulse_events_noi.tsv data/pulse_events_noi.tsv
          git config user.name "ISTAT PULSE Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pulse_observations.tsv data/pulse_observations_manifest.json data/pulse_events_noi.tsv
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified observed official sources"
            git pull --rebase origin main
            git push
          fi
