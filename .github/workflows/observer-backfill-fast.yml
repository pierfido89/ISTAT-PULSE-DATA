name: Fast Observer Backfill

permissions:
  contents: write

concurrency:
  group: pulse-observer-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ feat/news-engine ]
    paths:
      - '.github/workflows/observer-backfill-fast.yml'
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - run: python scripts/update_observer_archive.py
        env:
          PYTHONUNBUFFERED: '1'
      - run: test -s data/news/observer_articles.json
      - name: Commit observer archive
        run: |
          set -euo pipefail
          git add data/news/observer_articles.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh observer archive 2026"
          git pull --rebase origin feat/news-engine
          git push origin feat/news-engine
