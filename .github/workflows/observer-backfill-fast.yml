name: Fast Observer Backfill

permissions:
  contents: write

concurrency:
  group: pulse-observer-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run both CET/CEST candidates and gate by Europe/Rome.
    - cron: '0 4,5,9,10,14,15,20,21 * * *'
  push:
    branches: [ feat/news-engine ]
    paths:
      - '.github/workflows/observer-backfill-fast.yml'
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check Rome observer slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Rome date +%H)"
          case "$hour" in
            06|11|16|22) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
      - if: steps.slot.outputs.run == 'true'
        run: python -m pip install beautifulsoup4 pypdf
      - if: steps.slot.outputs.run == 'true'
        run: python scripts/update_observer_archive.py
        env:
          PYTHONUNBUFFERED: '1'
      - if: steps.slot.outputs.run == 'true'
        run: test -s data/news/observer_articles.json
      - name: Commit observer archive
        if: steps.slot.outputs.run == 'true'
        run: |
          set -euo pipefail
          git add data/news/observer_articles.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh observer archive 2026"
          git pull --rebase origin feat/news-engine
          git push origin feat/news-engine
