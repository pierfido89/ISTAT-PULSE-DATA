name: "PULSE Editorial AI 1.0 — offline quality tests"
on:
  pull_request:
    paths:
      - 'scripts/pulse_editorial_ai.py'
      - 'scripts/pulse_editorial_inference.py'
      - 'scripts/pulse_editorial_numeric_guard.py'
      - 'scripts/pulse_editorial_style.py'
      - 'scripts/pulse_editorial_brief.py'
      - 'scripts/pulse_editorial_sample.py'
      - 'scripts/pulse_editorial_evidence.py'
      - 'scripts/pulse_taxonomy.py'
      - 'tests/test_pulse_editorial_ai.py'
      - 'tests/test_pulse_editorial_real_pilot.py'
      - 'tests/test_pulse_editorial_v13.py'
      - '.github/workflows/verify-pulse-editorial-ai.yml'
  push:
    branches: [feat/pulse-editorial-ai-1.0]
    paths:
      - 'scripts/pulse_editorial_ai.py'
      - 'scripts/pulse_editorial_inference.py'
      - 'scripts/pulse_editorial_numeric_guard.py'
      - 'scripts/pulse_editorial_style.py'
      - 'scripts/pulse_editorial_brief.py'
      - 'scripts/pulse_editorial_sample.py'
      - 'tests/test_pulse_editorial_ai.py'
      - 'tests/test_pulse_editorial_real_pilot.py'
      - 'tests/test_pulse_editorial_v13.py'
      - '.github/workflows/verify-pulse-editorial-ai.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax (no external AI)
        run: python -m py_compile scripts/pulse_editorial_ai.py scripts/pulse_editorial_sample.py scripts/pulse_editorial_inference.py scripts/pulse_editorial_numeric_guard.py scripts/pulse_editorial_brief.py scripts/pulse_editorial_style.py
      - name: Run local draft-contract and inference regression tests (mock Ollama)
        run: python -m unittest discover -s tests -p 'test_pulse_editorial*.py' -v
      - name: Confirm production artifacts unchanged
        run: |
          git diff --exit-code -- data/news/articles.json data/news/index.json data/news/observer_articles.json

  official-istat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # External ISTAT availability can vary; never call remote AI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free PDF parser
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Prepare pilot workbench from official ISTAT PDF (not an AI call)
        run: python scripts/pulse_editorial_sample.py --output /tmp/pulse-tourism-workbench.json
      - name: Inspect evidence candidates offline
        run: python scripts/pulse_editorial_ai.py --input /tmp/pulse-tourism-workbench.json --inspect
      - name: Confirm no app feed files were modified
        run: git diff --exit-code -- data/news/articles.json data/news/index.json
