name: Probe BIGBANG Annual Schema

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-bigbang-annual.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check requests pandas openpyxl
      - name: Inspect annual sheet
        run: |
          python - <<'PY'
          import requests,io,pandas as pd
          u='https://groupware.sinanet.isprambiente.it/bigbang-data/library/bigbang100/excel_tables/bigbang100_tables_italy_01/download/en/1/BIGBANG100_TABLES_ITALY_01.xlsx'
          r=requests.get(u,timeout=120,headers={'User-Agent':'Mozilla/5.0 ISTAT-PULSE-DATA'}); r.raise_for_status()
          for header in [None,0,1,2,3]:
              df=pd.read_excel(io.BytesIO(r.content),sheet_name='Annuale (Annual)',header=header,nrows=15)
              print('\nHEADER',header,'SHAPE',df.shape)
              print('COLS',list(df.columns))
              print(df.to_string(max_cols=50))
          PY
