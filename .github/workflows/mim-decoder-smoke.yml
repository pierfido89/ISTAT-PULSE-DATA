name: MIM Decoder Smoke

on:
  workflow_dispatch:
  push:
    branches: [ feat/news-engine ]
    paths:
      - '.github/workflows/mim-decoder-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Inspect central MIM Google snippets
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re
          from bs4 import BeautifulSoup
          q='site:mim.gov.it/web/guest/-/ 2026'
          u='https://www.google.com/search?'+urllib.parse.urlencode({'q':q,'num':50,'filter':'0','hl':'it'})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1500000)
          soup=BeautifulSoup(raw.decode('utf-8','ignore'),'html.parser')
          n=0
          for h3 in soup.find_all('h3'):
              a=h3.find_parent('a',href=True)
              if not a: continue
              href=a.get('href','')
              if href.startswith('/url?'):
                  qs=urllib.parse.parse_qs(urllib.parse.urlparse(href).query)
                  href=(qs.get('q') or qs.get('url') or [''])[0]
              if 'mim.gov.it/web/guest/-/' not in href: continue
              node=h3
              for _ in range(5):
                  if node.parent is None: break
                  node=node.parent
              txt=re.sub(r'\s+',' ',node.get_text(' ',strip=True))
              print('RESULT',h3.get_text(' ',strip=True),flush=True)
              print('URL',href,flush=True)
              print('TEXT',txt[:1800],flush=True)
              n+=1
              if n>=20: break
          print('COUNT',n,flush=True)
          PY
