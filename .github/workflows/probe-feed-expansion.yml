name: Probe Feed Expansion

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'data/feed_expansion_registry.json'
      - 'scripts/probe_feed_expansion.py'
      - '.github/workflows/probe-feed-expansion.yml'
  schedule:
    - cron: '41 4 * * 1,4'

permissions:
  contents: write

concurrency:
  group: pulse-feed-expansion
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Probe 39 candidate permanent feeds
        run: python scripts/probe_feed_expansion.py

      - name: Validate expansion status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/feed_expansion_status.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["candidate_count"] == 39, data["candidate_count"]
          assert len(data["sources"]) == 39
          print(data["status_counts"])
          PY

      - name: Persist feed probe status
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ISTAT PULSE Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed_expansion_status.json
          if git diff --cached --quiet; then
            echo "No feed status changes."
          else
            git commit -m "data: refresh 39-source feed expansion status"
            git pull --rebase origin main
            git push
          fi
