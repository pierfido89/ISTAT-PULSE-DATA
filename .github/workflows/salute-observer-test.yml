name: Salute Observer Test

on:
  workflow_dispatch:
  push:
    branches: [ feat/news-engine ]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/salute-observer-test.yml'

jobs:
  test-salute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe Ministero Salute
        run: |
          python - <<'PY'
          import re, urllib.request
          urls = [
              "https://www.salute.gov.it/new/it/sezione/comunicati-stampa/",
              "https://www.salute.gov.it/new/it/altro/rss/",
              "https://www.salute.gov.it/portale/news/p3_2_4_1_1.jsp?lingua=italiano&menu=salastampa&p=comunicatistampa",
              "https://www.salute.gov.it/rss/comunicatiStampa.xml",
              "https://www.salute.gov.it/rss/comunicati-stampa.xml",
              "https://www.salute.gov.it/new/it/rss/comunicati-stampa/",
              "https://www.salute.gov.it/portale/news/rss.jsp",
              "http://www.salute.gov.it/portale/news/rss.jsp",
              "https://www.salute.gov.it/portale/news/RSS_comunicati_stampa.xml",
              "https://www.salute.gov.it/portale/news/RSS_comunicati.xml",
              "https://www.salute.gov.it/portale/news/RSS_comunicatistampa.xml",
              "https://r.jina.ai/https://www.salute.gov.it/new/it/sezione/comunicati-stampa/",
              "https://r.jina.ai/http://www.salute.gov.it/new/it/sezione/comunicati-stampa/",
          ]
          for u in urls:
              print("===",u,flush=True)
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(500000)
                      print("STATUS",r.status,"FINAL",r.geturl(),"CT",r.headers.get("Content-Type"),"BYTES",len(raw),flush=True)
                      txt=raw.decode("utf-8","ignore")
                      for href in re.findall(r'href=["\\\']([^"\\\']*(?:rss|feed)[^"\\\']*)["\\\']',txt,re.I)[:20]:
                          print("RSS_HREF",href,flush=True)
                      print(txt[:500].replace("\n"," "),flush=True)
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e),flush=True)
          PY
      - name: Inspect Bing RSS discovery
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET
          q='site:salute.gov.it/new/it/comunicato-stampa/ 2026'
          u='https://www.bing.com/search?'+urllib.parse.urlencode({'q':q,'format':'rss','setlang':'it-IT','count':50})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1000000)
          print('BYTES',len(raw))
          root=ET.fromstring(raw)
          for item in root.findall('.//item')[:25]:
              print('ITEM')
              print('TITLE',item.findtext('title'))
              print('LINK',item.findtext('link'))
              print('PUB',item.findtext('pubDate'))
              print('DESC',item.findtext('description'))
          PY
      - name: Test Salute only
        run: python scripts/update_observer_archive.py --only "Ministero della Salute"
