name: Salute Observer Test

on:
  workflow_dispatch:
  push:
    branches: [ feat/news-engine ]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/salute-observer-test.yml'

jobs:
  test-salute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe Ministero Salute
        run: |
          python - <<'PY'
          import re, urllib.request
          urls = [
              "https://www.salute.gov.it/new/it/sezione/comunicati-stampa/",
              "https://www.salute.gov.it/new/it/altro/rss/",
              "https://www.salute.gov.it/portale/news/p3_2_4_1_1.jsp?lingua=italiano&menu=salastampa&p=comunicatistampa",
              "https://www.salute.gov.it/rss/comunicatiStampa.xml",
              "https://www.salute.gov.it/rss/comunicati-stampa.xml",
              "https://www.salute.gov.it/new/it/rss/comunicati-stampa/",
              "https://www.salute.gov.it/portale/news/rss.jsp",
              "http://www.salute.gov.it/portale/news/rss.jsp",
              "https://www.salute.gov.it/portale/news/RSS_comunicati_stampa.xml",
              "https://www.salute.gov.it/portale/news/RSS_comunicati.xml",
              "https://www.salute.gov.it/portale/news/RSS_comunicatistampa.xml",
              "https://r.jina.ai/https://www.salute.gov.it/new/it/sezione/comunicati-stampa/",
              "https://r.jina.ai/http://www.salute.gov.it/new/it/sezione/comunicati-stampa/",
          ]
          for u in urls:
              print("===",u,flush=True)
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(500000)
                      print("STATUS",r.status,"FINAL",r.geturl(),"CT",r.headers.get("Content-Type"),"BYTES",len(raw),flush=True)
                      txt=raw.decode("utf-8","ignore")
                      for href in re.findall(r'href=["\\\']([^"\\\']*(?:rss|feed)[^"\\\']*)["\\\']',txt,re.I)[:20]:
                          print("RSS_HREF",href,flush=True)
                      print(txt[:500].replace("\n"," "),flush=True)
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e),flush=True)
          PY
      - name: Inspect Bing RSS discovery
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET
          q='site:salute.gov.it/new/it/comunicato-stampa/ 2026'
          u='https://www.bing.com/search?'+urllib.parse.urlencode({'q':q,'format':'rss','setlang':'it-IT','count':50})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1000000)
          print('BYTES',len(raw))
          root=ET.fromstring(raw)
          for item in root.findall('.//item')[:25]:
              print('ITEM')
              print('TITLE',item.findtext('title'))
              print('LINK',item.findtext('link'))
              print('PUB',item.findtext('pubDate'))
              print('DESC',item.findtext('description'))
          PY
      - name: Inspect DuckDuckGo discovery
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request
          from bs4 import BeautifulSoup
          q='site:salute.gov.it/new/it/comunicato-stampa/ "Data del comunicato" 2026'
          u='https://html.duckduckgo.com/html/?'+urllib.parse.urlencode({'q':q})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1000000)
          print('BYTES',len(raw))
          soup=BeautifulSoup(raw.decode('utf-8','ignore'),'html.parser')
          for res in soup.select('.result')[:25]:
              a=res.select_one('a.result__a')
              if not a: continue
              print('TITLE',a.get_text(' ',strip=True))
              print('LINK',a.get('href'))
              sn=res.select_one('.result__snippet')
              print('SNIP',sn.get_text(' ',strip=True) if sn else '')
          PY
      - name: Inspect Google News RSS discovery
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET
          q='site:salute.gov.it/new/it/comunicato-stampa/ 2026'
          u='https://news.google.com/rss/search?'+urllib.parse.urlencode({'q':q,'hl':'it','gl':'IT','ceid':'IT:it'})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2000000)
          print('BYTES',len(raw))
          root=ET.fromstring(raw)
          for item in root.findall('.//item')[:40]:
              print('GN_ITEM')
              print('GN_TITLE',item.findtext('title'))
              print('GN_LINK',item.findtext('link'))
              print('GN_PUB',item.findtext('pubDate'))
              print('GN_DESC',item.findtext('description'))
          PY
      - name: Inspect Google News article source link
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          q='site:salute.gov.it/new/it/comunicato-stampa/ after:2026-09-01 before:2026-11-01'
          u='https://news.google.com/rss/search?'+urllib.parse.urlencode({'q':q,'hl':'it','gl':'IT','ceid':'IT:it'})
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2000000)
          root=ET.fromstring(raw)
          item=root.find('.//item')
          link=item.findtext('link')
          print('GN',link)
          req=urllib.request.Request(link,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read(2000000).decode('utf-8','ignore')
              print('FINAL',r.geturl(),'BYTES',len(html))
          for pat in [
              r'https?://[^"\\\'<> ]*salute\\.gov\\.it[^"\\\'<> ]*',
              r'data-n-au=["\\\']([^"\\\']+)["\\\']',
              r'data-url=["\\\']([^"\\\']+)["\\\']'
          ]:
              vals=re.findall(pat,html,re.I)
              print('PAT',pat,'COUNT',len(vals))
              for v in vals[:20]: print('VAL',v)
          PY
      - name: Test Salute only
        run: python scripts/update_observer_archive.py --only "Ministero della Salute"
