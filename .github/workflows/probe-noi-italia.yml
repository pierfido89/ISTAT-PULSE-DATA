name: Inspect Noi Italia official download
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/probe-noi-italia.yml', 'scripts/probe_noi_italia.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pandas openpyxl
      - run: python scripts/probe_noi_italia.py
