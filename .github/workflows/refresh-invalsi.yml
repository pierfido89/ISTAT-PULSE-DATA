name: Refresh INVALSI feed
on:
  workflow_dispatch:
  schedule:
    - cron: '5 10 * * *'
  push:
    branches: [ main, feat/invalsi-feed ]
    paths:
      - 'scripts/update_invalsi.py'
      - '.github/workflows/refresh-invalsi.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_invalsi.py
      - run: test -s data/invalsi_latest.json
      - run: |
          if git diff --quiet -- data/invalsi_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/invalsi_latest.json data/sources_catalog.json
          git commit -m "data: refresh INVALSI feed"
          git push
