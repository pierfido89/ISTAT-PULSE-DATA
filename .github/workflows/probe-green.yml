name: Probe GREEN official sources

on:
  push:
    branches: [ green-integration ]
    paths:
      - 'scripts/probe_green_sources.py'
      - '.github/workflows/probe-green.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/probe_green_sources.py
      - run: python scripts/probe_green_endpoints.py
