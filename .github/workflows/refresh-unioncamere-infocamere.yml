name: Refresh Unioncamere InfoCamere feed
on:
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * *'
  push:
    branches: [ main, feat/unioncamere-infocamere-feed ]
    paths:
      - 'scripts/update_unioncamere_infocamere.py'
      - '.github/workflows/refresh-unioncamere-infocamere.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install beautifulsoup4
      - run: python scripts/update_unioncamere_infocamere.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/unioncamere_infocamere_latest.json").read_text())
          assert d["source"]=="Unioncamere - InfoCamere"
          assert d["validated_resource_count"]>=1
          print("UNIONCAMERE INFOCAMERE OK",d["validated_resource_count"])
          PY
      - run: |
          if git diff --quiet -- data/unioncamere_infocamere_latest.json data/sources_catalog.json; then exit 0; fi
          git config user.name "istat-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/unioncamere_infocamere_latest.json data/sources_catalog.json
          git commit -m "data: refresh Unioncamere InfoCamere feed"
          git push
