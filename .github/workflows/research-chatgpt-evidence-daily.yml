name: PULSE — official research evidence for ChatGPT

on:
  schedule:
    # Schedules run from default branch only. Time: UTC 06:00.
    - cron: '0 6 * * *'
  push:
    branches: [feat/pulse-editorial-ai-1.0]
    paths:
      - 'scripts/pulse_research_chatgpt_packet.py'
      - '.github/workflows/research-chatgpt-evidence-daily.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-official-research-experimental
  cancel-in-progress: false

jobs:
  verified-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pulse-editorial-ai-1.0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free official-PDF reader
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Six official ISTAT sources, full text and strict numeric extraction
        run: |
          set -euo pipefail
          mkdir -p /tmp/pulse-research
          python scripts/pulse_editorial_sample.py --output /tmp/pulse-research/tourism.json
          python scripts/pulse_research_labor_sample.py --output /tmp/pulse-research/labor.json
          python scripts/pulse_research_prices_sample.py --output /tmp/pulse-research/prices.json
          python scripts/pulse_research_new_domains_sample.py --domain popolazione --output /tmp/pulse-research/demography.json
          python scripts/pulse_research_new_domains_sample.py --domain istruzione --output /tmp/pulse-research/education.json
          python scripts/pulse_research_new_domains_sample.py --domain ambiente --output /tmp/pulse-research/environment.json
          python scripts/pulse_research_chatgpt_packet.py \
            /tmp/pulse-research/tourism.json /tmp/pulse-research/labor.json \
            /tmp/pulse-research/prices.json /tmp/pulse-research/demography.json \
            /tmp/pulse-research/education.json /tmp/pulse-research/environment.json \
            --output /tmp/pulse-research/evidence_packet.json
      - name: Validate contract without disclosing private drafts
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pulse-research/evidence_packet.json'))
          assert d['schema_version']=='pulse-research-to-chatgpt-v1'
          assert len(d['stories'])==16
          assert len({s['source_url'] for s in d['stories']})==6
          assert all(s['source_sha256'] and s['source_locations'] and s['facts']
                     for s in d['stories'])
          assert d['publication_allowed'] is False
          print('Six official sources verified. No LLM called, no article published.')
          PY
      - name: Update ONLY isolated experimental research packet when facts change
        run: |
          set -euo pipefail
          mkdir -p data/research
          cp /tmp/pulse-research/evidence_packet.json data/research/chatgpt_evidence_packet.json
          if git diff --quiet -- data/research/chatgpt_evidence_packet.json && git ls-files --error-unmatch data/research/chatgpt_evidence_packet.json >/dev/null 2>&1; then
            echo "No changes to verified research packet."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/chatgpt_evidence_packet.json
          git commit -m "research: refresh audited ChatGPT evidence packet (not app content)"
          git push origin HEAD:feat/pulse-editorial-ai-1.0
      - name: Explicitly no app publishing
        run: 'echo "No APK, Android main branch, news feed, private draft, or paid AI API modified."'
