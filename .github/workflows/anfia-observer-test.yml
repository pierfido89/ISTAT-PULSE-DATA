name: ANFIA Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/anfia-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-anfia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe ANFIA relay transport
        run: |
          set +e
          for u in \
            "https://r.jina.ai/http://www.anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa" \
            "https://r.jina.ai/https://www.anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa"
          do
            echo "=== $u"
            rm -f /tmp/anfia.txt
            curl -4 --http1.1 -L --connect-timeout 6 --max-time 25 \
              -A "Mozilla/5.0" -o /tmp/anfia.txt \
              -w "CURL code=%{http_code} size=%{size_download} connect=%{time_connect} start=%{time_starttransfer} total=%{time_total} final=%{url_effective}\\n" \
              "$u"
            python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/anfia.txt")
          if p.exists():
              text=p.read_text(errors="ignore")
              print("RELAY bytes=",len(text),"contains2026=",("2026" in text),"containsANFIA=",("ANFIA" in text))
              print(text[:1200].replace("\n"," | "))
          PY
          done
