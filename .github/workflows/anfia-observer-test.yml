name: ANFIA Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - '.github/workflows/anfia-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-anfia:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Probe DuckDuckGo ANFIA search
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re
          from bs4 import BeautifulSoup
          q='site:anfia.it/it/comunicazione/notizie-e-comunicati 2026 ANFIA'
          url='https://html.duckduckgo.com/html/?'+urllib.parse.urlencode({'q':q})
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  raw=r.read(2000000)
              soup=BeautifulSoup(raw.decode('utf-8','ignore'),'html.parser')
              results=soup.select('.result')
              print('DDG_COUNT',len(results),flush=True)
              for i,res in enumerate(results[:15]):
                  a=res.select_one('.result__a')
                  sn=res.select_one('.result__snippet')
                  print('RESULT',i,'|',re.sub(r'\\s+',' ',a.get_text(' ',strip=True) if a else '')[:180],
                        '|',a.get('href') if a else '',
                        '|',re.sub(r'\\s+',' ',sn.get_text(' ',strip=True) if sn else '')[:500],flush=True)
          except Exception as exc:
              print('DDG_ERROR',type(exc).__name__,exc,flush=True)
          PY
