name: ANFIA Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/anfia-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-anfia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Test ANFIA search-dated fallback only
        run: |
          python - <<'PY'
          from scripts.update_observer_archive import search_dated_candidates
          rows=search_dated_candidates("anfia.it",2026,160)
          print(f"ANFIA SEARCH-DATED COUNT={len(rows)}",flush=True)
          for title,url,pub in sorted(rows,key=lambda x:x[2],reverse=True):
              print(pub.date().isoformat(),"|",title[:140],"|",url,flush=True)
          PY
