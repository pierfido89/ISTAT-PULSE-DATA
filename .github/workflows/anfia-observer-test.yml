name: ANFIA Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - '.github/workflows/anfia-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-anfia:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe ANFIA direct
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, time
          url="https://www.anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa"
          req=urllib.request.Request(url,headers={
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36",
              "Accept":"text/html,application/xhtml+xml"
          })
          t=time.time()
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read(3000000)
                  print("ANFIA_DIRECT_OK",len(raw),r.geturl(),r.headers.get("Content-Type",""),"seconds",round(time.time()-t,2),flush=True)
                  print("HAS_2026",b"2026" in raw,flush=True)
          except Exception as exc:
              print("ANFIA_DIRECT_ERROR",type(exc).__name__,exc,"seconds",round(time.time()-t,2),flush=True)
          PY
