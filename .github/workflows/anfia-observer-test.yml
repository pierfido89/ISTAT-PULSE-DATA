name: ANFIA Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/anfia-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-anfia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe ANFIA transport
        run: |
          set +e
          for u in \
            "https://www.anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa" \
            "https://www.anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa?start=12" \
            "https://anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa"
          do
            echo "=== $u"
            curl -4 --http1.1 -L --connect-timeout 6 --max-time 18 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml" \
              -o /tmp/anfia.html \
              -w "CURL code=%{http_code} size=%{size_download} connect=%{time_connect} start=%{time_starttransfer} total=%{time_total} final=%{url_effective}\\n" \
              "$u"
            python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          p=Path("/tmp/anfia.html")
          if p.exists():
              raw=p.read_bytes()
              soup=BeautifulSoup(raw,"html.parser")
              text=soup.get_text(" ",strip=True)
              print("PARSED bytes=",len(raw),"h2=",len(soup.find_all("h2")),"h3=",len(soup.find_all("h3")),"contains2026=",("2026" in text))
          PY
          done
