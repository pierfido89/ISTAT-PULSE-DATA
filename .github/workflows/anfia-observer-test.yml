name: ANFIA Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/anfia-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-anfia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Inspect search result blocks
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re
          from bs4 import BeautifulSoup
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"
          q='site:anfia.it/it/comunicazione/notizie-e-comunicati/comunicati-stampa 2026'
          for engine,url in [
              ("bing","https://www.bing.com/search?"+urllib.parse.urlencode({"q":q,"setlang":"it-IT","count":20})),
              ("google","https://www.google.com/search?"+urllib.parse.urlencode({"q":q,"num":20,"filter":"0","hl":"it"}))
          ]:
              print("ENGINE",engine,url,flush=True)
              req=urllib.request.Request(url,headers={"User-Agent":UA})
              try:
                  with urllib.request.urlopen(req,timeout=8) as r: raw=r.read(1600000)
              except Exception as exc:
                  print("ERROR",engine,type(exc).__name__,exc,flush=True); continue
              soup=BeautifulSoup(raw.decode("utf-8","ignore"),"html.parser")
              if engine=="bing":
                  blocks=soup.select("li.b_algo")[:8]
              else:
                  blocks=[]
                  for h3 in soup.find_all("h3")[:8]:
                      node=h3
                      for _ in range(4):
                          if getattr(node,"parent",None) is None: break
                          node=node.parent
                      blocks.append(node)
              print("BLOCKS",len(blocks),flush=True)
              for i,b in enumerate(blocks):
                  txt=re.sub(r"\\s+"," ",b.get_text(" ",strip=True))
                  print(f"BLOCK {i}: {txt[:1200]}",flush=True)
          PY
