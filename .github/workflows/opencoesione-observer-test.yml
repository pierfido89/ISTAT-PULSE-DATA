name: OpenCoesione Observer Test

on:
  push:
    branches: [feat/news-engine]
    paths:
      - 'scripts/update_observer_archive.py'
      - 'data/observer_sources.json'
      - '.github/workflows/opencoesione-observer-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-opencoesione:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/news-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Probe OpenCoesione endpoints
        run: |
          python - <<'PY'
          import urllib.request,re,json
          urls=[
            "https://opencoesione.gov.it/it/opendata/",
            "https://opencoesione.gov.it/sitemap.xml",
            "https://opencoesione.gov.it/robots.txt",
            "https://opencoesione.gov.it/it/feed/",
            "https://opencoesione.gov.it/feed/",
            "https://opencoesione.gov.it/wp-json/",
          ]
          for u in urls:
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(2500000); ct=r.headers.get("Content-Type",""); final=r.geturl()
                  txt=raw.decode("utf-8","ignore")
                  print("URL",u,"OK",r.status,ct,"BYTES",len(raw),"FINAL",final,flush=True)
                  print("COUNT2026",txt.count("2026"),"SITEMAP",txt.lower().count("sitemap"),"API",txt.lower().count("api"),flush=True)
                  for p in re.findall(r'https?://[^"\'<> ]+',txt)[:30]:
                      if "2026" in p or "opendata" in p.lower():
                          print("LINK",p[:500],flush=True)
              except Exception as e:
                  print("URL",u,"ERROR",type(e).__name__,e,flush=True)
          PY
      - name: Probe OpenCoesione API and direct downloads
        run: |
          python - <<'PY'
          import subprocess, json, re
          urls=[
            "https://opencoesione.gov.it/api/",
            "https://www.opencoesione.gov.it/api/",
            "http://opencoesione.gov.it/api/",
            "http://www.opencoesione.gov.it/api/",
            "https://opencoesione.gov.it/api/progetti.json",
            "https://www.opencoesione.gov.it/api/progetti.json",
            "http://opencoesione.gov.it/api/progetti.json",
            "https://opencoesione.gov.it/api/aggregati.json",
          ]
          for u in urls:
              cmd=["curl","-L","--max-time","20","-sS","-o","/tmp/oc.body","-w","%{http_code}|%{content_type}|%{url_effective}",
                   "-A","Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
                   "-H","Accept: application/json,text/html;q=0.9,*/*;q=0.8",
                   u]
              p=subprocess.run(cmd,capture_output=True,text=True)
              meta=p.stdout.strip()
              try: raw=open("/tmp/oc.body","rb").read(500000)
              except: raw=b""
              txt=raw.decode("utf-8","ignore")
              print("CURL",u,meta,"BYTES",len(raw),flush=True)
              print("HEAD",re.sub(r"\s+"," ",txt[:500]),flush=True)
          PY
      - name: Probe dati.gov.it OpenCoesione mirror
        run: |
          python - <<'PY'
          import urllib.request,re
          urls=[
            "https://www.dati.gov.it/node/view-dataset/dataset?id=8bc00078-ab67-4101-88a4-08cee65861cb",
            "https://www.dati.gov.it/node/192",
          ]
          for u in urls:
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(1800000); ct=r.headers.get("Content-Type",""); final=r.geturl()
                  txt=raw.decode("utf-8","ignore")
                  print("DATIGOV",u,"OK",r.status,ct,"BYTES",len(raw),"FINAL",final,flush=True)
                  print("OC_COUNT",txt.lower().count("opencoesione"),"DATE2026",len(re.findall(r"2026[-/]\d{2}[-/]\d{2}",txt)),flush=True)
                  for m in re.findall(r'<form[^>]*action=["\']([^"\']*)["\'][^>]*>(.*?)</form>',txt,re.I|re.S):
                      body=m[1]
                      if "dataset" in body.lower() or "cerca" in body.lower():
                          print("FORM",m[0],flush=True)
                          for inp in re.findall(r'<input[^>]+>',body,re.I):
                              print("INPUT",re.sub(r"\s+"," ",inp)[:500],flush=True)
              except Exception as e:
                  print("DATIGOV",u,"ERROR",type(e).__name__,e,flush=True)
          PY
      - name: Test OpenCoesione only
        run: python scripts/update_observer_archive.py --only OpenCoesione
